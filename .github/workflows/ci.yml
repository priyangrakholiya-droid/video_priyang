name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The tests that touch audio or video build their own media with ffmpeg
      # and skip themselves when it is missing. Install it so they run.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version | Select-Object -First 1

      - name: Check the machine is ready
        env:
          PYTHONPATH: src
        run: python -m video_editor doctor

      - name: Run the tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

      - name: End-to-end smoke test
        if: runner.os == 'Linux'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          bash scripts/run_sample_pipeline.sh 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Put the tail of the log into a workflow annotation. Annotations
            # are readable through the public API, so a failure here can be
            # diagnosed without anyone downloading the raw log.
            msg=$(tail -n 60 smoke.log \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=smoke test failed (exit ${status})::${msg}"
            exit "$status"
          fi

      # So a failure can be diagnosed from the artifact alone, without
      # anyone having to read the raw job log.
      - name: Keep the smoke test output when it fails
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            smoke.log
            sample/result.json
            sample/plan.txt
            projects/sample-run/project.json
            projects/sample-run/edit.json
            projects/sample-run/**/*.json
            projects/sample-run/**/*.csv
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install it and check the entry point
        run: |
          python -m pip install dist/*.whl
          video-editor --version
          video-editor presets

      - name: Every shipped preset must be valid JSON
        run: |
          for f in config/presets/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || exit 1
            echo "ok $f"
          done
          python -c "import json; json.load(open('videoeditor.json')); print('ok videoeditor.json')"
