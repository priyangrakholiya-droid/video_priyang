[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editor"
version = "0.1.0"
description = "A five-step command line video editor for engagement and marriage films"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["video", "editing", "ffmpeg", "wedding", "beat-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = []

[project.optional-dependencies]
face = ["fer"]

[project.scripts]
video-editor = "video_editor.cli:main"

[project.urls]
Homepage = "https://github.com/priya/video_editor"
Issues = "https://github.com/priya/video_editor/issues"

[tool.setuptools.packages.find]
include = ["video_editor*"]
